# Publish datamancy to npm WITH provenance, via GitHub Actions Trusted
# Publishing (tokenless OIDC). No NODE_AUTH_TOKEN secret exists: the workflow's
# short-lived OIDC identity both authorizes the publish AND signs the Sigstore
# provenance attestation linking the tarball to this commit + workflow.
#
# Flow: a `v*` tag release fires this. The `test` job runs first, ungated; only
# if the suite is green does the `publish` job become reachable, and it pauses
# in the `npm-publish` environment for your passkey-backed approval before it
# touches the registry. So you approve AFTER seeing green, never blind.
#
# One-time setup (done): npmjs.com → datamancy → Trusted Publishing → GitHub
# Actions, repo watmin/datamancy, workflow publish.yml, environment npm-publish.
#
# The KMS manifest signing on datamancy.dev is a SEPARATE, deliberately-manual
# trust act (also passkey-backed) and never moves into CI.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # package.json declares `engines.node: ">=20"`, and this suite is the sole
    # publish gate — so the FLOOR has to be one of the versions it runs on.
    # Testing only on 22 made ">=20" an untested claim: any API newer than 20
    # would have shipped green. Both ends of the declared range run here.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      # The network-gated tests are the ONLY coverage of verified signed
      # content — and of the spawned-process claim 1.1.0 exists for. Letting
      # them skip here would green the publish gate without them.
      - run: npm test # build + the full suite — the publish gate
        env:
          DATAMANCY_REQUIRE_NETWORK: "1"

  publish:
    needs: test # unreachable until the suite is green
    runs-on: ubuntu-latest
    environment: npm-publish # v*-tag-only + your passkey-backed approval
    permissions:
      contents: read
      id-token: write # OIDC: tokenless auth + provenance signing
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # PINNED, like every other third-party input in this file. This line
      # installs the code that performs the publish AND signs the Sigstore
      # provenance attestation, inside the only job holding `id-token: write` —
      # so it was the one unpinned input in the most privileged step. `@latest`
      # is 12.x now; the workflow was validated on the 11 line. Trusted
      # Publishing needs npm >= 11.5.1, which setup-node's bundled npm does not
      # meet, so the install itself is required. Dependabot cannot see a version
      # inside a `run:` line — bump this deliberately, after reading the diff.
      - run: npm install -g npm@11.19.0 # OIDC-capable (Trusted Publishing >= 11.5.1)
      - run: npm ci
      - run: npm publish --provenance --access public
